# Arm settings. Units: mm, x forward, y left, z up (arm base frame). Angles in radians.
# Every value marked PLACEHOLDER is a guess from the Waveshare wiki examples:
# run `python calibrate.py` on the real arm to replace them.

port: auto                  # serial port, e.g. /dev/ttyUSB0; "auto" picks the only USB serial port

bounds:                     # PLACEHOLDER: conservative box the gripper tip must stay inside
  x: [150, 300]
  y: [-120, 120]
  z: [80, 260]              # z min is the floor: keeps the gripper off the table

home: [235, 0, 234]         # PLACEHOLDER: wiki example pose

gripper:
  open: 1.6                 # PLACEHOLDER: 1.08 is fully open per the wiki
  closed: 3.14              # PLACEHOLDER: 3.14 is fully closed per the wiki

speed: 30                   # default mm/s (keep low for first runs)
max_speed: 60               # PLACEHOLDER: hard cap on commanded speed, mm/s
max_segment_mm: 30          # longer moves are split into checked waypoints
tolerance_mm: 8             # PLACEHOLDER: max error between target and measured pose after a move
settle_timeout_s: 5
